name: Windows Desktop build release

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ master ]
    paths:
    - 'windows/**'
    - '.github/workflows/windows-desktop-build-release.yml'
  workflow_dispatch:
  pull_request:
    branches: [ master ]
    paths:
    - 'windows/**'
    - '.github/workflows/windows-desktop-build-release.yml'

jobs:
  build:

    runs-on: windows-latest

    steps:

    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

    - name: Setup .NET
      uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2
      with:
        dotnet-version: 8.0.422

    - name: Restore
      shell: pwsh
      working-directory: ./windows
      run: dotnet restore starsky.csproj

    - name: Build (Release)
      shell: pwsh
      working-directory: ./windows
      run: dotnet build starsky.csproj --configuration Release --no-restore

    - name: Test
      shell: pwsh
      working-directory: ./windows
      run: dotnet test starsky.Tests/starsky.Tests.csproj --configuration Release --verbosity normal

    - name: Publish (Release)
      shell: pwsh
      working-directory: ./windows
      run: >
        dotnet publish starsky.csproj
        --configuration Release
        --runtime win-x64
        --self-contained true
        --output ./publish/win-x64
        -p:PublishSingleFile=false

    - name: Upload artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: starsky-win-x64-desktop
        path: windows/publish/win-x64/
        if-no-files-found: error
