name: WebApp Docker buildx multi-arch CI unstable master

concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ master ]
    paths:
    - '.github/workflows/starsky-docker-buildx.yml'
    - 'starsky/**'
    
  pull_request:
    branches: [ master ]
    paths:
    - '.github/workflows/starsky-docker-buildx.yml'
    - 'starsky/Dockerfile'
    
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
    
      - name: Check Out Repo 
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        
      - name: Log in to Github Container registry
        uses: docker/login-action@0a596b2e7a325f0cedf8e9bd21ab002cbd3c9241
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}        

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@1a2e524850ecdcf656b58ac28634bff640ec0d41

      - name: Inspect Docker Buildx ghcr.io/${{ github.repository }}-unstable-nightly
        run: |
          echo "Name:      ${{ steps.buildx.outputs.name }}"
          echo "Endpoint:  ${{ steps.buildx.outputs.endpoint }}"
          echo "Status:    ${{ steps.buildx.outputs.status }}"
          echo "Flags:     ${{ steps.buildx.outputs.flags }}"
          echo "Platforms: ${{ steps.buildx.outputs.platforms }}"

      - name: Extract metadata Github Actions (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@703896b4f30f62d53f5530a80bcdc589a3f702bc
        with:
          images: |
            ghcr.io/${{ github.repository }}-unstable-nightly

      - name: Build and push master
        id: docker_build_push
        uses: docker/build-push-action@2ca78c6bec76527009825f31aae0532b4d40d820
        if: github.event_name != 'pull_request'
        with:
          context: ./starsky
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TOOLS=true
            GitCommitHash=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}-unstable-nightly:latest
            ghcr.io/${{ github.repository }}-unstable-nightly:v${{ github.run_id }}

      - name: Build and don't push
        id: docker_build_pull_request
        uses: docker/build-push-action@2ca78c6bec76527009825f31aae0532b4d40d820
        if: github.event_name == 'pull_request'
        with:
          context: ./starsky
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false
          build-args: |
            TOOLS=true
            GitCommitHash=${{ github.sha }}
