name: WebApp Build .NET macOS

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ master ]
    paths:
    - 'starsky/**'
    - '!starsky/starsky/clientapp/**'
  workflow_dispatch:
  pull_request:
    branches: [ master ]
    paths:
    - 'starsky/**'
    - '!starsky/starsky/clientapp/**'
    - '.github/workflows/webapp-build-net-macos.yml'
    - '!starsky/Dockerfile'
    - '!starsky/docker_demo_setup.sh'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            arch: x64
          - os: macos-latest
            arch: arm64

    runs-on: ${{ matrix.os }}

    env:
      WEBSITE_SITE_NAME: "ci"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        dotnet-version: 10.0.400

    - name: "BuildNetCore (MacOS ${{ matrix.arch }})"
      shell: bash
      working-directory: ./starsky
      run: bash build.sh --Target BuildNetCore --no-sonar --no-publish --no-dependencies --no-logo

    - name: "TestNetCore (MacOS ${{ matrix.arch }})"
      shell: bash
      working-directory: ./starsky
      run: bash build.sh --Target TestNetCore --no-logo --no-publish
