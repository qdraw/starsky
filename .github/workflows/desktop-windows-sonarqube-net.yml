name: "Desktop Windows SonarQube .NET"

on:
  workflow_dispatch:
  pull_request:
    types:
      - synchronize
      - opened
    branches:
      - master
    paths:
      - 'windows/**'
      - '.github/workflows/desktop-windows-sonarqube-net.yml'
  push:
    branches: [master]
    paths:
      - 'windows/**'
      - '.github/workflows/desktop-windows-sonarqube-net.yml'
  schedule:
    - cron: '36 0 * * 0,2,4,6'

permissions:
  contents: read

env:
  PR_NUMBER_GITHUB: ${{ github.event.pull_request.number }}

jobs:
  build:
    name: Test and analyze
    runs-on: windows-latest

    env:
      WEBSITE_SITE_NAME: "ci"

    steps:
      - name: 'Checkout repository on branch: ${{ github.REF }}'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.HEAD_REF }}

      - name: Retrieve entire repository history
        run: git fetch --prune --unshallow

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2
        with:
          dotnet-version: 10.0.400

      - name: Use Java 21
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: 'zulu'
          java-version: '21'
          check-latest: true
          java-package: jdk
          architecture: x64

      - name: Cache NuGet packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-windows-${{ hashFiles('windows/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-windows-

      - name: Cache SonarQube packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.sonar
          key: ${{ runner.os }}-build-desktop-wpf-sonar
          restore-keys: |
            ${{ runner.os }}-build-desktop-wpf-sonar

      - name: Install dotnet-sonarscanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin SonarQube analysis
        shell: pwsh
        env:
          STARSKY_SONAR_KEY: "starsky-desktop-windows"
          STARSKY_SONAR_TOKEN: ${{ secrets.STARSKY_SONAR_TOKEN }}
          STARSKY_SONAR_ORGANISATION: ${{ secrets.STARSKY_SONAR_ORGANISATION }}
          STARSKY_SONAR_URL: ${{ vars.STARSKY_SONAR_URL }} # use default
        run: |
          if (-not $env:STARSKY_SONAR_TOKEN -or -not $env:STARSKY_SONAR_KEY) {
            Write-Host "SonarQube secrets not fully configured, skipping analysis"
            exit 0
          }
          $sonarUrl = if ($env:STARSKY_SONAR_URL) { $env:STARSKY_SONAR_URL } else { "https://sonarcloud.io" }
          $prArgs = @()
          if ($env:PR_NUMBER_GITHUB) {
            $prArgs += "/d:sonar.pullrequest.key=$env:PR_NUMBER_GITHUB"
            $prArgs += "/d:sonar.pullrequest.branch=$env:GITHUB_HEAD_REF"
            $prArgs += "/d:sonar.pullrequest.base=$env:GITHUB_BASE_REF"
            $prArgs += "/d:sonar.pullrequest.provider=github"
            $prArgs += "/d:sonar.pullrequest.github.endpoint=https://api.github.com/"
            $prArgs += "/d:sonar.pullrequest.github.repository=$env:GITHUB_REPOSITORY"
          }
          dotnet sonarscanner begin `
            /k:"$env:STARSKY_SONAR_KEY" `
            /o:"$env:STARSKY_SONAR_ORGANISATION" `
            /d:sonar.token="$env:STARSKY_SONAR_TOKEN" `
            /d:sonar.host.url="$sonarUrl" `
            /d:sonar.inclusions="windows/**" `
            /d:sonar.exclusions="starsky/**,starskydesktop/**,starsky-tools/**,documentation/**,mac/**" `
            /d:sonar.coverage.inclusions="windows/**" `
            /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml" `
            @prArgs

      - name: Build
        shell: pwsh
        run: dotnet build windows/starsky.Tests/starsky.Tests.csproj -c Release

      - name: Test with coverage
        shell: pwsh
        run: |
          dotnet test windows/starsky.Tests/starsky.Tests.csproj `
            --no-build `
            -c Release `
            --collect:"XPlat Code Coverage" `
            --results-directory TestResults/ `
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: End SonarQube analysis
        shell: pwsh
        env:
          STARSKY_SONAR_TOKEN: ${{ secrets.STARSKY_SONAR_TOKEN }}
          STARSKY_SONAR_URL: ${{ vars.STARSKY_SONAR_URL }}
        run: |
          if (-not $env:STARSKY_SONAR_TOKEN) {
            Write-Host "SonarQube secrets not fully configured, skipping analysis"
            exit 0
          }
          dotnet sonarscanner end /d:sonar.token="$env:STARSKY_SONAR_TOKEN"
