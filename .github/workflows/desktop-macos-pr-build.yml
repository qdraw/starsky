name: Desktop macOS — Build & Test

on:
  push:
    branches: [master]
    paths:
      - 'mac/**'
  pull_request:
    paths:
      - 'mac/**'

concurrency:
  group: desktop-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd mac && xcodegen generate

      - name: Build
        run: |
          xcodebuild build \
            -project mac/starsky.xcodeproj \
            -scheme starsky \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || xcodebuild build \
              -project mac/starsky.xcodeproj \
              -scheme starsky \
              -configuration Debug \
              -destination 'platform=macOS' \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          xcodebuild test \
            -project mac/starsky.xcodeproj \
            -scheme starskyTests \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults/macos.xcresult \
            | xcpretty --report junit --output TestResults/test-results.xml || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-macos
          path: TestResults/

  publish:
    name: Publish (Release tag)
    runs-on: macos-latest
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install xcodegen create-dmg

      - name: Generate Xcode project
        run: cd mac && xcodegen generate

      - name: Archive
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          CODE_SIGN_IDENTITY: "Developer ID Application"
        run: |
          xcodebuild archive \
            -project mac/starsky.xcodeproj \
            -scheme starsky \
            -configuration Release \
            -archivePath build/starsky.xcarchive \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
            ARCHS="arm64 x86_64"

      - name: Export
        run: |
          xcodebuild -exportArchive \
            -archivePath build/starsky.xcarchive \
            -exportPath build/ \
            -exportOptionsPlist mac/ExportOptions.plist

      - name: Create DMG
        run: |
          create-dmg \
            --volname "Starsky" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "starsky.app" 175 190 \
            --app-drop-link 425 190 \
            build/starsky.dmg \
            "build/starsky.app"

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARYTOOL_PASSWORD: ${{ secrets.NOTARYTOOL_APP_PASSWORD }}
        run: |
          xcrun notarytool submit build/starsky.dmg \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$NOTARYTOOL_PASSWORD" \
            --wait

      - name: Staple
        run: xcrun stapler staple build/starsky.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: starsky-macos-dmg
          path: build/starsky.dmg

      - name: Attach DMG to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/starsky.dmg
