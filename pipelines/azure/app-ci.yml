- stage: buildwin
  displayName: 'Build Windows Desktop App (WPF + Velopack)'
  dependsOn: buildnetcore
  jobs:
  - job: build
    displayName: 'Build Windows Desktop (WPF + Velopack)'
    pool:
      vmImage: 'windows-2022'
    steps:
    - checkout: self
      clean: true
      fetchDepth: 1

    - task: DownloadPipelineArtifact@2
      displayName: 'Download win-x64'
      inputs:
        source: 'current'
        artifactName: 'win-x64'
        path: '$(Build.SourcesDirectory)/starsky'

    - task: PowerShell@2
      displayName: 'Unzip Windows backend'
      inputs:
        targetType: 'inline'
        script: Expand-Archive $(Build.SourcesDirectory)/starsky/starsky-win-x64.zip -DestinationPath $(Build.SourcesDirectory)/starsky/win-x64

    - template: /pipelines/azure/steps/use_dotnet_version.yml

    - task: PowerShell@2
      displayName: 'Install Velopack CLI'
      inputs:
        targetType: 'inline'
        script: dotnet tool install -g vpk --version 1.2.0

    - task: PowerShell@2
      displayName: 'Get version'
      name: getversion
      inputs:
        targetType: 'inline'
        script: |
          $branch = "$(Build.SourceBranch)"
          if ($branch -match 'refs/tags/v(.+)') {
            $version = $Matches[1]
          } else {
            [xml]$proj = Get-Content windows/Starsky.Desktop.csproj
            $version = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          }
          Write-Host "Building version: $version"
          Write-Host "##vso[task.setvariable variable=VERSION;isOutput=true]$version"

    - task: PowerShell@2
      displayName: 'Publish WPF app'
      inputs:
        targetType: 'inline'
        script: |
          dotnet publish windows/Starsky.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o ./publish-win

    - task: PowerShell@2
      displayName: 'Pack with Velopack'
      inputs:
        targetType: 'inline'
        script: |
          vpk pack `
            --packId Starsky.Desktop `
            --packVersion $(getversion.VERSION) `
            --packDir ./publish-win `
            --mainExe Starsky.Desktop.exe `
            --outputDir ./velopack-releases `
            --packTitle "Starsky Desktop" `
            --icon windows/Resources/starsky.ico

    - task: PowerShell@2
      displayName: 'Rename setup to starsky-win-x64-desktop.exe'
      inputs:
        targetType: 'inline'
        script: |
          $setup = Get-Item ./velopack-releases/*-Setup.exe
          Move-Item $setup.FullName ./velopack-releases/starsky-win-x64-desktop.exe

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Artifact: starsky-win-x64-desktop (WPF)'
      inputs:
        path: './velopack-releases/starsky-win-x64-desktop.exe'
        ArtifactName: 'starsky-win-x64-desktop-wpf'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Artifact: Velopack feed'
      inputs:
        path: './velopack-releases'
        ArtifactName: 'starsky-win-x64-velopack-feed'
