parameters:
- name: codeSign
  displayName: 'Enable code signing'
  type: boolean
  default: false

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  NUGET_XMLDOC_MODE: skip
  CI: true
  npm_config_cache: $(Pipeline.Workspace)/.npm
  NUGET_PACKAGES: $(Pipeline.Workspace)/.nuget/packages

trigger:
  branches:
    include:
    - release/*
    exclude:
    - feature/*
  paths:
      include:
      - starskydesktop/*
      - mac/**
      - windows/**
      exclude:
      - starsky/*
      - starsky-tools/*
      - starskydesktop/*.md
      - starskydesktop/readme.md

# specific path build
pr:
  branches:
    exclude:
    - master
  paths:
    include:
    - starskydesktop/*
    - mac/**
    - windows/**
    exclude:
    - starsky/*
    - starsky-tools/*
    - starsky.netframework/*

stages:
- stage: buildnetcore
  displayName: 'Build .NET Core'
  jobs:
  - job: buildnetcore
    displayName: 'Build .NET Core'
    pool:
      vmImage: 'ubuntu-24.04'

    steps:
    - checkout: self
      clean: true
      fetchDepth: 1

    - template: /pipelines/azure/steps/use_dotnet_version.yml

    - template: /pipelines/azure/steps/build_clientapp.yml
      parameters:
        jest: false
        runtimeArg: '--runtime "win-x64,linux-x64,osx-x64,osx-arm64"'
        npmConfigCache: $(npm_config_cache)

    - template: /pipelines/azure/steps/build_server.yml
      parameters:
        vstest: false
        readyToRunEnabled: false
        runtimeArg: '--runtime "win-x64,linux-x64,osx-x64,osx-arm64"'
        nugetPackages: $(NUGET_PACKAGES)

    - template: /pipelines/azure/steps/build_zip_bundle.yml
      parameters:
        runtimeArg: '--runtime "win-x64,linux-x64,osx-x64,osx-arm64"'

    - template: /pipelines/azure/steps/publish_artifacts.yml
      parameters:
        publish:
          - key: osx-x64
            value: '/starsky/starsky-osx-x64.zip'
          - key: generic-netcore
            value: '/starsky/starsky-generic-netcore.zip'
          - key: linux-x64
            value: '/starsky/starsky-linux-x64.zip'
          - key: win-x64
            value: '/starsky/starsky-win-x64.zip'
          - key: osx-arm64
            value: '/starsky/starsky-osx-arm64.zip'

- stage: buildelectron
  displayName: 'Build Electron'
  dependsOn: buildnetcore
  jobs:
  - job: build
    displayName: 'Build Electron'
    pool:
      vmImage: 'ubuntu-24.04'
    container: electronuserland/builder:20-wine
    steps:
    - task: DownloadPipelineArtifact@2
      inputs:
        source: 'current'
        artifactName: 'win-x64'
        path: '$(Build.SourcesDirectory)'

    - task: DownloadPipelineArtifact@2
      inputs:
        source: 'current'
        artifactName: 'osx-x64'
        path: '$(Build.SourcesDirectory)'

    - task: DownloadPipelineArtifact@2
      inputs:
        source: 'current'
        artifactName: 'osx-arm64'
        path: '$(Build.SourcesDirectory)'

    - template: /pipelines/azure/steps/electron_build.yml
      parameters:
        codeSign: ${{ parameters.codeSign }}

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Artifact: starsky-win-x64-desktop'
      inputs:
        path: '$(Build.SourcesDirectory)/starskydesktop/dist-prod/starsky-win-x64-desktop.exe'
        ArtifactName: 'starsky-win-x64-desktop'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Artifact: starsky-mac-x64-desktop'
      inputs:
        path: '$(Build.SourcesDirectory)/starskydesktop/dist-prod/starsky-mac-x64-desktop.zip'
        ArtifactName: 'starsky-mac-x64-desktop'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Artifact: starsky-mac-arm64-desktop'
      inputs:
        path: '$(Build.SourcesDirectory)/starskydesktop/dist-prod/starsky-mac-x64-desktop.zip'
        ArtifactName: 'starsky-mac-arm64-desktop'

- stage: buildmacnative
  displayName: 'Build Mac Desktop App (native Swift)'
  dependsOn: buildnetcore
  jobs:

  - job: build_universal
    displayName: 'Build Mac Desktop (universal)'
    pool:
      vmImage: 'macOS-latest'
    steps:
    - checkout: self
      clean: true
      fetchDepth: 1

    - task: DownloadPipelineArtifact@2
      displayName: 'Download osx-x64'
      inputs:
        source: 'current'
        artifactName: 'osx-x64'
        path: '$(Build.SourcesDirectory)/starsky'

    - task: DownloadPipelineArtifact@2
      displayName: 'Download osx-arm64'
      inputs:
        source: 'current'
        artifactName: 'osx-arm64'
        path: '$(Build.SourcesDirectory)/starsky'

    - task: Bash@3
      displayName: 'Unzip osx-x64 backend'
      inputs:
        targetType: 'inline'
        script: unzip $(Build.SourcesDirectory)/starsky/starsky-osx-x64.zip -d $(Build.SourcesDirectory)/starsky/osx-x64

    - task: Bash@3
      displayName: 'Unzip osx-arm64 backend'
      inputs:
        targetType: 'inline'
        script: unzip $(Build.SourcesDirectory)/starsky/starsky-osx-arm64.zip -d $(Build.SourcesDirectory)/starsky/osx-arm64

    - task: Bash@3
      displayName: 'Install tools'
      inputs:
        targetType: 'inline'
        script: brew install xcodegen create-dmg

    - task: Bash@3
      displayName: 'Generate Xcode project'
      inputs:
        targetType: 'inline'
        script: cd mac && xcodegen generate

    - ${{ if eq(parameters.codeSign, true) }}:
      - task: Bash@3
        displayName: 'Import code signing certificate'
        inputs:
          targetType: 'inline'
          script: bash mac/scripts/import-cert.sh
        env:
          MACOS_CERTIFICATE: $(STARSKY_MACOS_CERTIFICATE)
          MACOS_CERTIFICATE_PWD: $(STARSKY_MACOS_CERTIFICATE_PWD)
          MACOS_KEYCHAIN_PASSWORD: $(STARSKY_MACOS_KEYCHAIN_PASSWORD)

    - ${{ if eq(parameters.codeSign, true) }}:
      - task: Bash@3
        displayName: 'Archive (universal, signed)'
        inputs:
          targetType: 'inline'
          script: |
            xcodebuild archive \
              -project mac/starsky.xcodeproj \
              -scheme starsky \
              -configuration Release \
              -archivePath build/starsky.xcarchive \
              DEVELOPMENT_TEAM="LHZ4426ABB" \
              CODE_SIGN_IDENTITY="Developer ID Application" \
              ARCHS="arm64 x86_64"

    - ${{ if eq(parameters.codeSign, false) }}:
      - task: Bash@3
        displayName: 'Archive (universal, unsigned)'
        inputs:
          targetType: 'inline'
          script: |
            xcodebuild archive \
              -project mac/starsky.xcodeproj \
              -scheme starsky \
              -configuration Release \
              -archivePath build/starsky.xcarchive \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              ARCHS="arm64 x86_64"

    - ${{ if eq(parameters.codeSign, true) }}:
      - task: Bash@3
        displayName: 'Export'
        inputs:
          targetType: 'inline'
          script: |
            xcodebuild -exportArchive \
              -archivePath build/starsky.xcarchive \
              -exportPath build/ \
              -exportOptionsPlist mac/ExportOptions.plist

    - ${{ if eq(parameters.codeSign, false) }}:
      - task: Bash@3
        displayName: 'Copy app from archive (unsigned)'
        inputs:
          targetType: 'inline'
          script: cp -r "build/starsky.xcarchive/Products/Applications/starsky.app" "build/starsky.app"

    - task: Bash@3
      displayName: 'Create DMG'
      inputs:
        targetType: 'inline'
        script: |
          create-dmg \
            --volname "Starsky" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "starsky.app" 175 190 \
            --app-drop-link 425 190 \
            build/starsky-mac-universal-desktop.dmg \
            "build/starsky.app"

    - ${{ if eq(parameters.codeSign, true) }}:
      - task: Bash@3
        displayName: 'Sign DMG'
        inputs:
          targetType: 'inline'
          script: codesign --force --sign "Developer ID Application" build/starsky-mac-universal-desktop.dmg

      - task: Bash@3
        displayName: 'Notarize and staple'
        inputs:
          targetType: 'inline'
          script: |
            bash mac/scripts/notarize.sh \
              build/starsky-mac-universal-desktop.dmg \
              "$(STARSKY_APPLE_ID)" \
              "LHZ4426ABB" \
              "$(STARSKY_MACOS_NOTARYTOOL_APP_PASSWORD)"

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Artifact: starsky-mac-universal-desktop'
      inputs:
        path: 'build/starsky-mac-universal-desktop.dmg'
        ArtifactName: 'starsky-mac-universal-desktop'

