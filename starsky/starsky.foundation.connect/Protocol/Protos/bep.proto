syntax = "proto3";

option csharp_namespace = "starsky.foundation.connect.Protocol.Generated";

// ── Pre-auth ─────────────────────────────────────────────────────────────────

message Hello {
    string device_name    = 1;
    string client_name    = 2;
    string client_version = 3;
    int64  timestamp      = 4;  // Unix epoch seconds; must be non-zero
    int32  num_connections = 5; // for multi-connection BEP
}

// ── Post-auth header ─────────────────────────────────────────────────────────

message Header {
    MessageType        type        = 1;
    MessageCompression compression = 2;
}

enum MessageType {
    CLUSTER_CONFIG    = 0;
    INDEX             = 1;
    INDEX_UPDATE      = 2;
    REQUEST           = 3;
    RESPONSE          = 4;
    DOWNLOAD_PROGRESS = 5;
    PING              = 6;
    CLOSE             = 7;
}

enum MessageCompression {
    NONE = 0;
    LZ4  = 1;
}

// ── ClusterConfig ─────────────────────────────────────────────────────────────

message ClusterConfig {
    repeated Folder folders = 1;
    bool            secondary = 2; // true on a secondary (multi-connection) BEP link
}

message Folder {
    string           id          = 1;
    string           label       = 2;
    FolderType       type        = 3;
    FolderStopReason stop_reason = 7;
    repeated Device  devices     = 16;
}

enum FolderType {
    FOLDER_TYPE_SEND_RECEIVE      = 0;
    FOLDER_TYPE_SEND_ONLY         = 1;
    FOLDER_TYPE_RECEIVE_ONLY      = 2;
    FOLDER_TYPE_RECEIVE_ENCRYPTED = 3;
}

enum FolderStopReason {
    FOLDER_STOP_REASON_UNKNOWN             = 0;
    FOLDER_STOP_REASON_IDLE                = 1;
    FOLDER_STOP_REASON_NOT_SHARING_WITH    = 2;
}

message Device {
    bytes           id                         = 1;
    string          name                       = 2;
    repeated string addresses                  = 3;
    Compression     compression                = 4;
    string          cert_name                  = 5;
    int64           max_sequence               = 6;
    bool            introducer                 = 7;
    uint64          index_id                   = 8;
    bool            skip_introduction_removals = 9;
    bytes           encryption_password_token  = 10;
}

enum Compression {
    COMPRESSION_METADATA = 0;
    COMPRESSION_NEVER    = 1;
    COMPRESSION_ALWAYS   = 2;
}

// ── Index / IndexUpdate ───────────────────────────────────────────────────────

message Index {
    string            folder = 1;
    repeated FileInfo files  = 2;
}

message IndexUpdate {
    string            folder = 1;
    repeated FileInfo files  = 2;
}

message FileInfo {
    string           name                  = 1;
    FileInfoType     type                  = 2;
    int64            size                  = 3;
    uint32           permissions           = 4;
    int64            modified_s            = 5;
    int32            modified_ns           = 11;
    uint64           modified_by           = 12;
    bool             deleted               = 6;
    bool             invalid               = 7;
    bool             no_permissions        = 8;
    Vector           version               = 9;
    int64            sequence              = 10;
    int32            block_size            = 13;
    repeated BlockInfo Blocks              = 16;
    string           symlink_target        = 17;
    bytes            blocks_hash           = 18; // SHA-256 of all block hashes concatenated
    bytes            encrypted             = 19;
    bytes            previous_blocks_hash  = 20; // for rolling-hash delta sync
    PlatformData     platform              = 21; // Unix xattrs, Windows metadata
}

enum FileInfoType {
    FILE              = 0;
    DIRECTORY         = 1;
    SYMLINK_FILE      = 2; // deprecated; use SYMLINK
    SYMLINK_DIRECTORY = 3; // deprecated; use SYMLINK
    SYMLINK           = 4;
}

message PlatformData {
    UnixData    unix    = 1;
    WindowsData windows = 2;
}

message UnixData {
    string owner_name = 1;
    string group_name = 2;
    uint32 owner_uid  = 3;
    uint32 owner_gid  = 4;
}

message WindowsData {
    // stub — Windows file attributes; fields to be added as needed
}

message BlockInfo {
    int64 offset = 1;
    int32 size   = 2;
    bytes hash   = 3;
    uint32 weak_hash = 4;
}

message Vector {
    repeated Counter counters = 1;
}

message Counter {
    uint64 id    = 1;
    uint64 value = 2;
}

// ── Request / Response ────────────────────────────────────────────────────────

message Request {
    int32  id             = 1;
    string folder         = 2;
    string name           = 3;
    int64  offset         = 4;
    int32  size           = 5;
    bytes  hash           = 6;
    bool   from_temporary = 7;
    int32  block_no       = 9;
}

message Response {
    int32     id   = 1;
    bytes     data = 2;
    ErrorCode code = 3;
}

enum ErrorCode {
    NO_ERROR     = 0;
    GENERIC      = 1;
    NO_SUCH_FILE = 2;
    INVALID_FILE = 3;
}

// ── DownloadProgress ──────────────────────────────────────────────────────────

message DownloadProgress {
    string                              folder  = 1;
    repeated FileDownloadProgressUpdate updates = 2;
}

message FileDownloadProgressUpdate {
    FileDownloadProgressUpdateType update_type   = 1;
    string                         name          = 2;
    Vector                         version       = 3;
    repeated int32                 block_indexes = 4;
}

enum FileDownloadProgressUpdateType {
    APPEND = 0;
    FORGET = 1;
}

// ── Ping / Close ──────────────────────────────────────────────────────────────

message Ping {}

message Close {
    string reason = 1;
}

// ── Local discovery ───────────────────────────────────────────────────────────

message Announce {
    bytes           id          = 1;
    repeated string addresses   = 2;
    uint64          instance_id = 3; // random 64-bit value; peers detect restart when it changes
}
